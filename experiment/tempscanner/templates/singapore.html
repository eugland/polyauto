<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Singapore Temp Probability</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    .slot-0-card { border-color: #4dabf7 !important; }
    .slot-0-header { color: #4dabf7; }
    .prob-badge { font-size: 0.85em; font-weight: 600; margin-left: 0.5rem; }
  </style>
</head>
<body>
<div class="container-fluid py-3">

  <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
    <h5 class="mb-0">🌡 Singapore — Highest Temp Probability (0 am–12 pm)</h5>
    <div class="d-flex gap-2 align-items-center">
      <small class="text-muted" id="status-text">Loading…</small>
      <button class="btn btn-sm btn-outline-secondary" onclick="load()">↺ Refresh</button>
      <a href="/" class="btn btn-sm btn-outline-secondary">← Scanner</a>
    </div>
  </div>

  <div id="error-box" class="alert alert-danger d-none mb-3"></div>

  <div id="info-bar" class="d-none mb-3 p-2 rounded bg-body-secondary small text-muted d-flex flex-wrap gap-3">
    <span>City: <strong id="info-city" class="text-body"></strong></span>
    <span>Today: <strong id="info-today" class="text-body"></strong></span>
    <span>Slot 0 (highest probable): <strong id="info-slot0" class="text-primary"></strong>
      <span class="prob-badge text-primary" id="info-prob0"></span>
    </span>
  </div>

  <!-- Slot −1 -->
  <div class="card mb-3" id="card-minus1">
    <div class="card-header fw-semibold" id="title-minus1">Slot −1</div>
    <div class="card-body">
      <canvas id="chart-minus1" style="max-height:320px"></canvas>
    </div>
  </div>

  <!-- Slot 0 (highest probable) -->
  <div class="card mb-3 slot-0-card" id="card-0">
    <div class="card-header fw-semibold slot-0-header" id="title-0">Slot 0 — Highest Probable</div>
    <div class="card-body">
      <canvas id="chart-0" style="max-height:320px"></canvas>
    </div>
  </div>

  <!-- Slot +1 -->
  <div class="card mb-3" id="card-plus1">
    <div class="card-header fw-semibold" id="title-plus1">Slot +1</div>
    <div class="card-body">
      <canvas id="chart-plus1" style="max-height:320px"></canvas>
    </div>
  </div>

</div>

<script>
const DAY_PALETTE = [
  { border: '#4dabf7', bg: 'rgba(77,171,247,0.12)',  width: 2.5 }, // today
  { border: '#ff6b35', bg: 'rgba(255,107,53,0.12)',  width: 1.8 }, // yesterday
  { border: '#51cf66', bg: 'rgba(81,207,102,0.12)', width: 1.8 }, // -2 days
  { border: '#cc5de8', bg: 'rgba(204,93,232,0.12)', width: 1.8 }, // -3 days
];

const HOUR_TICK = v => {
  const h = Math.round(v);
  if (v !== h) return '';
  if (h === 0)  return '12 am';
  if (h < 12)   return h + ' am';
  if (h === 12) return '12 pm';
  return '';
};

const charts = {};

function buildChart(canvasId, slotData, dates, dayLabels) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (charts[canvasId]) charts[canvasId].destroy();

  const datasets = dates.map((date, i) => {
    const palette = DAY_PALETTE[i] || DAY_PALETTE[DAY_PALETTE.length - 1];
    const pts = slotData.days[date] || [];
    return {
      label: `${dayLabels[i]}  (${date})`,
      data: pts,
      borderColor: palette.border,
      backgroundColor: palette.bg,
      borderWidth: palette.width,
      pointRadius: pts.length > 40 ? 2 : 4,
      pointHoverRadius: 6,
      showLine: true,
      tension: 0.25,
      fill: false,
    };
  });

  charts[canvasId] = new Chart(canvas, {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 14, padding: 14 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const h = ctx.parsed.x;
              const hr = Math.floor(h);
              const min = Math.round((h - hr) * 60).toString().padStart(2, '0');
              return `${ctx.dataset.label.split('  ')[0]}: ${ctx.parsed.y.toFixed(1)}%  @  ${hr}:${min}`;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          min: 0, max: 12,
          title: { display: true, text: 'Singapore local time' },
          ticks: { stepSize: 1, callback: HOUR_TICK },
          grid: { color: 'rgba(255,255,255,0.07)' },
        },
        y: {
          min: 0, max: 100,
          title: { display: true, text: 'YES probability (%)' },
          ticks: { callback: v => v + '%' },
          grid: { color: 'rgba(255,255,255,0.07)' },
        }
      }
    }
  });
}

function setTitle(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

async function load() {
  document.getElementById('status-text').textContent = 'Loading…';
  document.getElementById('error-box').classList.add('d-none');

  let data;
  try {
    const res = await fetch('/api/singapore-chart');
    data = await res.json();
  } catch (e) {
    document.getElementById('error-box').textContent = 'Network error: ' + e.message;
    document.getElementById('error-box').classList.remove('d-none');
    document.getElementById('status-text').textContent = 'Error';
    return;
  }

  if (data.error) {
    document.getElementById('error-box').textContent = data.error;
    document.getElementById('error-box').classList.remove('d-none');
    document.getElementById('status-text').textContent = 'Error';
    return;
  }

  const { city, today, dates, day_labels, slots } = data;

  document.getElementById('info-bar').classList.remove('d-none');
  document.getElementById('info-city').textContent = city;
  document.getElementById('info-today').textContent = today;

  const slot0 = slots['0'];
  if (slot0) {
    document.getElementById('info-slot0').textContent = slot0.label;
    document.getElementById('info-prob0').textContent = slot0.current_prob.toFixed(1) + '%';
  }

  const slotMinus = slots['-1'];
  if (slotMinus) {
    setTitle('title-minus1', `Slot −1: ${slotMinus.label}  —  current ${slotMinus.current_prob.toFixed(1)}%`);
    buildChart('chart-minus1', slotMinus, dates, day_labels);
    document.getElementById('card-minus1').classList.remove('d-none');
  } else {
    document.getElementById('card-minus1').classList.add('d-none');
  }

  if (slot0) {
    setTitle('title-0', `Slot 0 — Highest Probable: ${slot0.label}  —  current ${slot0.current_prob.toFixed(1)}%`);
    buildChart('chart-0', slot0, dates, day_labels);
  }

  const slotPlus = slots['1'];
  if (slotPlus) {
    setTitle('title-plus1', `Slot +1: ${slotPlus.label}  —  current ${slotPlus.current_prob.toFixed(1)}%`);
    buildChart('chart-plus1', slotPlus, dates, day_labels);
    document.getElementById('card-plus1').classList.remove('d-none');
  } else {
    document.getElementById('card-plus1').classList.add('d-none');
  }

  document.getElementById('status-text').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

load();
setInterval(load, 60000);
</script>
</body>
</html>

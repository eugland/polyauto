<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<div class="container-fluid py-3">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h4 class="mb-0">Trading Dashboard</h4>
    <button class="btn btn-sm btn-outline-secondary" onclick="refreshAll()">&#8635; Refresh All</button>
  </div>

  <ul class="nav nav-tabs mb-3" id="mainTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-eth" type="button">
        ETH 1H Bot
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bs" type="button"
              onclick="if(!ftLoaded)loadFT()">
        BTC 5m BS Test
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-weather" type="button">
        Weather Bets
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ETH 1H ============================== -->
    <div class="tab-pane fade show active" id="tab-eth" role="tabpanel">

      <!-- stat row -->
      <div class="d-flex flex-wrap gap-3 mb-3" id="eth-stats">
        <div class="stat-box text-muted text-center">loading</div>
      </div>

      <!-- sub-tabs for P/L and Trades -->
      <ul class="nav nav-tabs nav-pills mb-3" id="ethSubTabs" role="tablist" style="border-bottom: 1px solid #30363d;">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#eth-sub-profit" type="button">
            P/L & Chart
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#eth-sub-trades" type="button">
            Transactions
          </button>
        </li>
      </ul>

      <!-- P/L sub-tab -->
      <div class="tab-content">
        <div class="tab-pane fade show active" id="eth-sub-profit" role="tabpanel">
          <!-- time period filters -->
          <div class="d-flex gap-2 mb-3">
            <small class="text-muted align-self-center">Filter:</small>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterEthChart('1d')" id="btn-1d">1D</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterEthChart('1w')" id="btn-1w">1W</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterEthChart('1y')" id="btn-1y">1Y</button>
            <button class="btn btn-sm btn-outline-secondary active" onclick="filterEthChart('all')" id="btn-all">All</button>
          </div>

          <!-- P/L chart -->
          <div class="card">
            <div class="card-header fw-bold">Cumulative P/L</div>
            <div class="card-body">
              <canvas id="eth-chart" style="max-height:400px"></canvas>
            </div>
          </div>
        </div>

        <!-- Trades sub-tab -->
        <div class="tab-pane fade" id="eth-sub-trades" role="tabpanel">
          <!-- trades table -->
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span class="fw-bold">Transactions</span>
              <div class="d-flex gap-3 align-items-center">
                <div class="form-check form-switch mb-0">
                  <input class="form-check-input" type="checkbox" id="showDryRun" checked>
                  <label class="form-check-label small" for="showDryRun">Show dry-run</label>
                </div>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-scroll" style="max-height: 600px;">
                <table class="table table-sm mb-0">
                  <thead style="position:sticky;top:0;z-index:1">
                    <tr>
                      <th>Time (UTC)</th><th>Slug</th><th>Dir</th><th>Entry</th>
                      <th>Shares</th><th>Cost</th><th>Mins left</th><th>Mode</th>
                      <th>Outcome</th><th>P/L</th>
                    </tr>
                  </thead>
                  <tbody id="eth-trades-body"></tbody>
                </table>
              </div>
            </div>
            <!-- pagination -->
            <div class="card-footer d-flex justify-content-between align-items-center small text-muted">
              <span id="eth-pagination-info"></span>
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary" id="eth-prev-btn" onclick="ethPrevPage()">← Prev</button>
                <button class="btn btn-sm btn-outline-secondary" id="eth-next-btn" onclick="ethNextPage()">Next →</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- live log (expanded) -->
      <div class="card mt-4">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="fw-bold">
            Live Log
            <small class="text-muted ms-2" id="log-ts"></small>
          </span>
          <div class="d-flex gap-3 align-items-center">
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" id="hideNoise" checked>
              <label class="form-check-label small" for="hideNoise">Hide idle lines</label>
            </div>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" id="autoScroll" checked>
              <label class="form-check-label small" for="autoScroll">Auto-scroll</label>
            </div>
          </div>
        </div>
        <div class="card-body p-2">
          <div class="log-box" id="log-box" style="height: 500px; overflow-y: auto;"></div>
        </div>
      </div>
    </div>

    <!-- WEATHER ============================= -->
    <div class="tab-pane fade" id="tab-weather" role="tabpanel">
      <div class="d-flex flex-wrap gap-3 mb-3" id="weather-stats">
        <div class="stat-box text-muted text-center">loading</div>
      </div>
      <div class="card">
        <div class="card-header fw-bold">Weather Bets</div>
        <div class="card-body p-0">
          <div class="table-scroll" style="max-height:600px">
            <table class="table table-sm mb-0">
              <thead style="position:sticky;top:0;z-index:1">
                <tr>
                  <th>Time</th><th>City</th><th>Event</th><th>Question</th>
                  <th>Shares</th><th>Price</th><th>Cost</th>
                  <th>Forecast</th><th>Margin</th>
                  <th>Outcome</th><th>Res. Temp</th><th>Edit</th>
                </tr>
              </thead>
              <tbody id="weather-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- BS FORWARD TEST ======================= -->
    <div class="tab-pane fade" id="tab-bs" role="tabpanel">

      <!-- filter row -->
      <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
        <div class="d-flex align-items-center gap-2">
          <label class="small text-muted">Min edge filter:</label>
          <input type="number" id="ft-min-edge" value="0.00" step="0.01" min="0" max="1"
                 class="edit-input" style="width:70px">
          <button class="edit-btn" onclick="loadFT()">Apply</button>
        </div>
        <small class="text-muted" id="ft-meta"></small>
      </div>

      <!-- global stats -->
      <div class="d-flex flex-wrap gap-3 mb-3" id="ft-global-stats"></div>

      <!-- per-asset panels -->
      <div id="ft-content"></div>

      <div class="card mt-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="fw-bold">BS Bet Log</span>
          <small class="text-muted" id="ft-log-ts"></small>
        </div>
        <div class="card-body p-2">
          <div class="log-box" id="ft-log-box"></div>
        </div>
      </div>
    </div>

  </div><!-- /tab-content -->
</div><!-- /container -->

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>

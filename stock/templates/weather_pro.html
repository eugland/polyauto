<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    html, body { height: 100%; }
    .sidebar {
      width: 200px; min-width: 200px;
      border-right: 1px solid var(--bs-border-color);
      height: calc(100vh - 52px); overflow-y: auto; padding: 12px 8px;
    }
    .user-card { cursor: pointer; transition: border-color .15s; }
    .user-card.active { border-color: #4a9eff !important; }
    .user-card .meta { font-size: 0.72rem; }
    .main-panel { flex: 1; overflow-y: auto; padding: 16px; height: calc(100vh - 52px); }
    .table { font-size: 0.82rem; }
    .scroll-table { max-height: 340px; overflow-y: auto; }
    .pill-yes { display:inline-block; padding:1px 7px; border-radius:99px; font-size:0.72rem; background:#1a3a1a; color:#6fcf6f; }
    .pill-no  { display:inline-block; padding:1px 7px; border-radius:99px; font-size:0.72rem; background:#3a1a1a; color:#cf6f6f; }
    .pnl-pos { color: #6fcf6f; }
    .pnl-neg { color: #cf6f6f; }
    .topbar { border-bottom: 1px solid var(--bs-border-color); padding: 8px 16px; display:flex; align-items:center; gap:10px; }
  </style>
</head>
<body>
<div class="topbar">
  <a class="btn btn-sm btn-outline-secondary" href="/">← Dashboard</a>
  <a class="btn btn-sm btn-outline-primary" href="/weather-log">Weather Log</a>
  <span class="ms-2 fw-semibold">Weather Pro</span>
  <span id="status" class="ms-auto text-muted" style="font-size:0.78rem"></span>
  <button class="btn btn-sm btn-outline-secondary" onclick="refresh()">↻ Refresh</button>
</div>

<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-muted mb-2" style="font-size:0.72rem;text-transform:uppercase;letter-spacing:.05em">Traders</div>

    <div class="user-card active" id="card-haerder" onclick="selectUser('haerder')">
      <div class="name">@haerder</div>
      <div class="meta" id="meta-haerder">—</div>
      <div class="mt-1">
        <a href="https://polymarket.com/@haerder" target="_blank" style="font-size:0.7rem">Profile ↗</a>
      </div>
    </div>

    <div class="user-card" id="card-sin3000" onclick="selectUser('sin3000')">
      <div class="name">@sin3000</div>
      <div class="meta" id="meta-sin3000">—</div>
      <div class="mt-1">
        <a href="https://polymarket.com/@sin3000" target="_blank" style="font-size:0.7rem">Profile ↗</a>
      </div>
    </div>

    <div class="user-card card mb-2 p-2" id="card-aapang" onclick="selectUser('aapang')">
      <div class="name">@aapang</div>
      <div class="meta" id="meta-aapang">—</div>
      <div class="mt-1">
        <a href="https://polymarket.com/@aapang" target="_blank" style="font-size:0.7rem">Profile ↗</a>
      </div>
    </div>
  </div>

  <!-- Main panel -->
  <div class="main-panel">
    <div id="panel-content">
      <div class="text-muted">Select a trader on the left.</div>
    </div>
  </div>
</div>

<script>
let allData = { positions: {}, activity: {} };
let selectedUser = 'haerder';

const USERS = {
  haerder: { label: '@haerder' },
  sin3000: { label: '@sin3000' },
  aapang:  { label: '@aapang'  },
};

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt(v, d=2) { const n=parseFloat(v); return isNaN(n)?'—':n.toFixed(d); }
function pct(v) { const n=parseFloat(v); return isNaN(n)?'—':(n>=0?'+':'')+n.toFixed(1)+'%'; }

function fmtTime(ts) {
  if (!ts) return '—';
  // handle unix epoch (seconds or ms)
  let d;
  const n = parseFloat(ts);
  if (!isNaN(n)) {
    d = new Date(n > 1e10 ? n : n * 1000);
  } else {
    d = new Date(ts);
  }
  if (isNaN(d.getTime())) return String(ts).slice(0,16);
  return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function sidePill(side, type) {
  const s = String(side||'').toUpperCase();
  const t = String(type||'').toUpperCase();
  // Show type badge for non-trade operations
  if (t && t !== 'TRADE' && t !== '') {
    const colours = {
      CONVERSION: 'background:#2a1a4a;color:#c39ef7',
      REDEEM:     'background:#1a3a2a;color:#6fcfaf',
      SPLIT:      'background:#4a2a1a;color:#f7c36f',
      MERGE:      'background:#1a2a3a;color:#6fb8f7',
    };
    const style = colours[t] || 'background:#2a2a2a;color:#aaa';
    return `<span class="pill-yes" style="${style}">${esc(t)}</span>`;
  }
  if (s === 'YES' || s === 'BUY') return `<span class="pill-yes">${esc(s)}</span>`;
  if (s === 'NO'  || s === 'SELL') return `<span class="pill-no">${esc(s)}</span>`;
  return `<span style="color:#888">${esc(s||'—')}</span>`;
}

function shortTitle(t) {
  return esc(String(t||'—').replace(/Will the highest temperature in /i,'').replace(/\?$/,'').slice(0,55));
}

function isTemperatureItem(item) {
  const fields = [item.title, item.market, item.question, item.eventTitle, item.slug];
  return fields.some(f => typeof f === 'string' && f.includes('°'));
}

function renderPanel(user) {
  const rawPositions = allData.positions[user] || [];
  const rawActivity  = allData.activity[user]  || [];
  const positions = Array.isArray(rawPositions) ? rawPositions.filter(isTemperatureItem) : rawPositions;
  const activity  = Array.isArray(rawActivity)  ? rawActivity.filter(isTemperatureItem)  : rawActivity;
  const panel = document.getElementById('panel-content');

  // positions table
  let posRows = '';
  let totalValue = 0;
  let totalPnl = 0;
  if (Array.isArray(positions) && positions.length) {
    for (const p of positions) {
      const title  = shortTitle(p.title || p.market || p.question || p.conditionId);
      const side   = p.outcome || p.side || '';
      const size   = fmt(p.size || p.currentValue);
      const entry  = p.avgPrice != null ? (parseFloat(p.avgPrice)*100).toFixed(2)+'¢' : '—';
      const cur    = p.curPrice != null ? (parseFloat(p.curPrice)*100).toFixed(2)+'¢' : '—';
      const pnl    = p.cashPnl ?? p.pnl ?? null;
      const pnlStr = pnl != null ? `<span class="${parseFloat(pnl)>=0?'pnl-pos':'pnl-neg'}">$${fmt(pnl)}</span>` : '—';
      if (p.currentValue) totalValue += parseFloat(p.currentValue)||0;
      if (pnl != null) totalPnl += parseFloat(pnl)||0;
      posRows += `<tr>
        <td title="${esc(p.title||p.question||'')}" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</td>
        <td>${sidePill(side)}</td>
        <td>${size}</td>
        <td>${entry}</td>
        <td>${cur}</td>
        <td>${pnlStr}</td>
      </tr>`;
    }
  } else {
    posRows = '<tr><td colspan="6" class="text-dim p-3">No open positions</td></tr>';
  }

  // activity table
  let actRows = '';
  if (Array.isArray(activity) && activity.length) {
    for (const a of activity.slice(0, 500)) {
      const title = shortTitle(a.title || a.market || a.question);
      const side  = a.side || a.outcome || '';
      const type  = a.type || '';
      const price = a.price != null ? (parseFloat(a.price)*100).toFixed(2)+'¢' : '—';
      const size  = fmt(a.size || a.usdcSize);
      const ts    = fmtTime(a.timestamp || a.created_at || a.createdAt || a.time);
      actRows += `<tr>
        <td title="${esc(a.title||a.question||'')}" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</td>
        <td>${sidePill(side, type)}</td>
        <td>${price}</td>
        <td>${size}</td>
        <td class="text-dim">${esc(ts)}</td>
      </tr>`;
    }
  } else {
    actRows = '<tr><td colspan="5" class="text-dim p-3">No recent activity</td></tr>';
  }

  const summaryHtml = Array.isArray(positions) && positions.length
    ? `<span class="me-3">${positions.length} position(s)</span>
       <span class="me-3">Portfolio ~<strong>$${totalValue.toFixed(2)}</strong></span>
       <span class="${totalPnl>=0?'pnl-pos':'pnl-neg'}">P&L $${fmt(totalPnl)}</span>`
    : '';

  panel.innerHTML = `
    <div class="mb-1 small" style="color:#aaa">${summaryHtml}</div>

    <div class="card mb-3">
      <div class="card-header">Open Positions</div>
      <div class="card-body">
        <div class="scroll-table">
          <table class="table table-sm mb-0">
            <thead><tr>
              <th>Market</th><th>Side</th><th>Size</th><th>Avg Entry</th><th>Current</th><th>P&amp;L</th>
            </tr></thead>
            <tbody>${posRows}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Recent Activity</div>
      <div class="card-body">
        <div class="scroll-table">
          <table class="table table-sm mb-0">
            <thead><tr>
              <th>Market</th><th>Side</th><th>Price</th><th>Size</th><th>Time</th>
            </tr></thead>
            <tbody>${actRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function selectUser(user) {
  selectedUser = user;
  document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + user).classList.add('active');
  renderPanel(user);
}

function updateSidebarMeta(user, positions) {
  const el = document.getElementById('meta-' + user);
  const filtered = Array.isArray(positions) ? positions.filter(isTemperatureItem) : [];
  if (!filtered.length) { el.textContent = 'No positions'; return; }
  let totalValue = 0;
  filtered.forEach(p => { totalValue += parseFloat(p.currentValue||0)||0; });
  el.textContent = `${filtered.length} pos · $${totalValue.toFixed(0)}`;
}

async function refresh() {
  document.getElementById('status').textContent = 'Refreshing…';
  try {
    const [posResp, actResp] = await Promise.all([
      fetch('/api/weather-pro/positions'),
      fetch('/api/weather-pro/activity'),
    ]);
    allData.positions = await posResp.json();
    allData.activity  = await actResp.json();

    for (const user of Object.keys(USERS)) {
      updateSidebarMeta(user, allData.positions[user]);
    }
    renderPanel(selectedUser);
    document.getElementById('status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>

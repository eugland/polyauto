<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Log</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0d0d0d; color: #e0e0e0; }
    .log-pane {
      background: #111; color: #c8ffc8; font-size: 0.78rem;
      font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-all;
      height: calc(100vh - 100px); overflow-y: auto; padding: 12px;
      border: 1px solid #2a2a2a; border-radius: 4px;
    }
    .line-ERROR   { color: #ff6b6b; }
    .line-WARNING { color: #ffd93d; }
    .line-INFO    { color: #c8ffc8; }
    .toolbar { padding: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .debug-info { font-size: 0.72rem; color: #555; font-family: monospace; }
    select.form-select, .form-check-label { color: #ccc; }
    select.form-select { background-color: #1a1a1a; border-color: #333; }
  </style>
</head>
<body>
<div class="container-fluid py-2">
  <div class="toolbar">
    <a class="btn btn-sm btn-outline-secondary" href="/">← Dashboard</a>
    <a class="btn btn-sm btn-outline-success" href="/weather-pro">Weather Pro</a>
    <label class="text-muted small ms-3 me-1">Lines</label>
    <select id="line-count" class="form-select form-select-sm" style="width:90px">
      <option value="100">100</option>
      <option value="200" selected>200</option>
      <option value="500">500</option>
    </select>
    <div class="form-check form-switch mb-0 ms-2">
      <input class="form-check-input" type="checkbox" id="auto-scroll" checked>
      <label class="form-check-label small" for="auto-scroll">Auto-scroll</label>
    </div>
    <span id="status" class="text-muted small ms-auto"></span>
  </div>
  <div id="debug" class="debug-info mb-1"></div>
  <div id="log" class="log-pane">Connecting…</div>
</div>

<script>
const pane    = document.getElementById('log');
const statusEl = document.getElementById('status');
const debugEl  = document.getElementById('debug');
const lineCountEl  = document.getElementById('line-count');
const autoScrollEl = document.getElementById('auto-scroll');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function colorize(line) {
  if (/ERROR/.test(line))   return `<span class="line-ERROR">${esc(line)}</span>`;
  if (/WARNING/.test(line)) return `<span class="line-WARNING">${esc(line)}</span>`;
  return `<span class="line-INFO">${esc(line)}</span>`;
}

async function fetchLog() {
  const lines = lineCountEl.value;
  try {
    const r = await fetch(`/api/weather-log?lines=${lines}`);
    if (!r.ok) {
      pane.textContent = `HTTP ${r.status}: ${r.statusText}`;
      statusEl.textContent = 'error';
      return;
    }
    const data = await r.json();
    debugEl.textContent = `path: ${data.path || '?'}  |  total lines in file: ${data.total_lines ?? '?'}`;
    if (data.error) {
      pane.textContent = 'Error: ' + data.error;
      statusEl.textContent = 'error';
      return;
    }
    if (!data.exists) {
      pane.textContent = `Log file not found.\nChecked: ${data.path || '?'}\n\nHas the bot been run yet? Try: python -m automata.weather`;
      statusEl.textContent = 'not found';
      return;
    }
    if (!data.lines.length) {
      pane.textContent = `File exists at ${data.path} but appears empty.`;
      statusEl.textContent = 'empty';
      return;
    }
    pane.innerHTML = data.lines.map(colorize).join('\n');
    if (autoScrollEl.checked) pane.scrollTop = pane.scrollHeight;
    statusEl.textContent = `${data.lines.length} lines · ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    pane.textContent = 'Fetch failed: ' + e.message;
    statusEl.textContent = 'fetch error';
  }
}

fetchLog();
setInterval(fetchLog, 3000);
lineCountEl.addEventListener('change', fetchLog);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7fbff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <title>BTC Pre-Candle Log</title>
  <script>
    (function () {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const set = (m) => document.documentElement.setAttribute(
        'data-bs-theme', m.matches ? 'dark' : 'light');
      set(mq);
      mq.addEventListener('change', set);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/style.css?v=adaptive1">
  <style>
    .toolbar { padding: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .debug-info { font-size: 0.72rem; color: var(--bs-secondary-color); font-family: monospace; }
    @media (max-width: 576px) {
      .log-pane { height: calc(100vh - 150px); font-size: 0.72rem; }
    }
  </style>
</head>
<body>
<div class="container-fluid py-2">
  <div class="toolbar">
    <a class="btn btn-sm btn-outline-secondary" href="./">&larr; Dashboard</a>
    <a class="btn btn-sm btn-outline-danger" href="btc-shadow">BTC Shadow</a>
    <a class="btn btn-sm btn-outline-warning" href="btc-live">BTC Live</a>
    <label class="text-muted small ms-3 me-1">Lines</label>
    <select id="line-count" class="form-select form-select-sm" style="width:90px">
      <option value="100">100</option>
      <option value="200" selected>200</option>
      <option value="500">500</option>
      <option value="1000">1000</option>
    </select>
    <div class="form-check form-switch mb-0 ms-2">
      <input class="form-check-input" type="checkbox" id="auto-scroll" checked>
      <label class="form-check-label small" for="auto-scroll">Auto-scroll</label>
    </div>
    <span id="status" class="text-muted small ms-auto"></span>
  </div>
  <div id="debug" class="debug-info mb-1"></div>
  <div id="log" class="log-pane">Connecting&hellip;</div>
</div>

<script>
const pane    = document.getElementById('log');
const statusEl = document.getElementById('status');
const debugEl  = document.getElementById('debug');
const lineCountEl  = document.getElementById('line-count');
const autoScrollEl = document.getElementById('auto-scroll');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function withBasePath(url) {
  if (!url || !url.startsWith('/')) return url;
  const p = window.location.pathname || '/';
  if (p === '/stock' || p.startsWith('/stock/')) return '/stock' + url;
  return url;
}

function colorize(line) {
  if (/ERROR/.test(line))    return `<span class="line-ERROR">${esc(line)}</span>`;
  if (/WARNING/.test(line))  return `<span class="line-WARNING">${esc(line)}</span>`;
  // Highlight live-bet lines so you can spot real trades at a glance.
  if (/LIVE BUY/.test(line)) return `<span class="line-INFO" style="background:rgba(34,197,94,.15);font-weight:600">${esc(line)}</span>`;
  if (/LIVE skip|cap_hit|order_failed/.test(line))
                             return `<span class="line-INFO" style="background:rgba(234,179,8,.15)">${esc(line)}</span>`;
  if (/^.{0,40}FIRE /.test(line) || / FIRE /.test(line))
                             return `<span class="line-INFO" style="background:rgba(59,130,246,.10)">${esc(line)}</span>`;
  if (/settled /.test(line)) return `<span class="line-INFO" style="background:rgba(168,85,247,.12)">${esc(line)}</span>`;
  return `<span class="line-INFO">${esc(line)}</span>`;
}

async function fetchLog() {
  const lines = lineCountEl.value;
  try {
    const r = await fetch(withBasePath(`/api/btc-log?lines=${lines}`));
    if (!r.ok) {
      pane.textContent = `HTTP ${r.status}: ${r.statusText}`;
      statusEl.textContent = 'error';
      return;
    }
    const data = await r.json();
    debugEl.textContent = `path: ${data.path || '?'}  |  total lines in file: ${data.total_lines ?? '?'}`;
    if (data.error) {
      pane.textContent = 'Error: ' + data.error;
      statusEl.textContent = 'error';
      return;
    }
    if (!data.exists) {
      pane.innerHTML = `<span style="color:#ffd93d">&#9888; Log file not found: ${esc(data.path || '?')}</span>\n\nThe BTC pre-candle daemon is not running or has not written its first log line yet.\n\nStart it with:\n  <span style="color:#6fb8f7">python -m automata.btc_pre_candle --interval 20 --bet</span>\n\nThis page auto-refreshes every 3 seconds once the file exists.`;
      statusEl.textContent = 'not found';
      return;
    }
    if (!data.lines.length) {
      pane.innerHTML = `<span style="color:#ffd93d">Log file exists but is empty:</span> ${esc(data.path || '?')}`;
      statusEl.textContent = 'empty';
      return;
    }
    pane.innerHTML = data.lines.map(colorize).join('\n');
    if (autoScrollEl.checked) pane.scrollTop = pane.scrollHeight;
    statusEl.textContent = `${data.lines.length} lines &middot; ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    pane.textContent = 'Fetch failed: ' + e.message;
    statusEl.textContent = 'fetch error';
  }
}

fetchLog();
setInterval(fetchLog, 3000);
lineCountEl.addEventListener('change', fetchLog);
</script>
</body>
</html>

# polyauto tunable configuration
#
# Precedence at runtime: environment variable > this file > code default.
# Secrets (POLYMARKET_PRIVATE_KEY, RELAYER_API_KEY, etc.) stay in .env.
# Edit these values freely — every setting here has a matching default in
# Python code, so removing a key just restores the default.

[polymarket]
# POLYMARKET_HOST
host = "https://clob.polymarket.com"
# POLYMARKET_SIG_TYPE — 0=EOA, 1=Gnosis Safe/Magic.link, 2=Polymarket proxy
signature_type = 2
# POLYMARKET_RELAYER_URL
relayer_url = "https://relayer-v2.polymarket.com"


[weather]
# ── Price gates ───────────────────────────────────────────────────────────
# MIN_NO_PRICE — don't buy if the live bid is below this
min_no_price = 0.97
# MAX_NO_PRICE — don't buy if the live ask/bid is above this
max_no_price = 0.997
# BET_THRESHOLD — auto-bet above this price
bet_threshold = 0.95
# BET_SIZE_SHARES — USDC notional used to compute bet shares (run-time scales)
bet_size_shares = 64.0
# TAKE_PROFIT_PRICE — price at which to place the resting sell on held positions
take_profit_price = 0.999

# ── Market-maker pricing ──────────────────────────────────────────────────
# MM_TICK_SIZE
mm_tick_size = 0.001
# MM_JOIN_BID_TICKS — how many ticks above best bid to join
mm_join_bid_ticks = 1
# MM_REPRICE_CENTS — reprice an existing order only when delta exceeds this
mm_reprice_cents = 0.10

# ── City filter ───────────────────────────────────────────────────────────
# CITY_BLACKLIST — cities excluded from all candidates and top-ups.
# Override at runtime with comma-separated env var, e.g.
# CITY_BLACKLIST=Seoul,Lagos python -m automata.weather --bet
city_blacklist = [
    "Seoul",
    "Taipei",
    "Lagos",
    "Denver",
    "Jakarta",
    "Chongqing",
    "Hong Kong",
    "Shenzhen",
]

# ── Temperature safety margins ────────────────────────────────────────────
# METAR_GUARD_MARGIN_C / METAR_GUARD_MARGIN_F — advisory only, logs a warning
# when observed METAR temp is within this many degrees of the threshold.
metar_guard_margin_c = 2.0
metar_guard_margin_f = 4.0

# ── Weather-model edge logging ─────────────────────────────────────────────
# MODEL_EDGE_MAX_BPS — candidates where market NO ask exceeds the model's
# fair NO prob by more than this many bps are logged as "would-veto" but
# are not blocked. Useful for calibrating before enforcing the gate.
model_edge_max_bps = 200.0

# ── Scheduling ────────────────────────────────────────────────────────────
# POST_RESOLUTION_GRACE_HOURS — keep events in scope this long after resolve
post_resolution_grace_hours = 7.0
# SCAN_TARGET_CITIES — scan batches of 15 events (earliest-resolution first)
# until we've found this many distinct viable cities, then stop. Matches the
# downstream top-10 cap; raise to scan more, lower to scan less per cycle.
scan_target_cities = 10
# USER_TZ — timezone used for dry-run display
user_tz = "America/Los_Angeles"

# ── Order retries ─────────────────────────────────────────────────────────
# STALE_ORDER_MINUTES — cancel unfilled BUY orders older than this
stale_order_minutes = 1.0
# BET_PASSES — total passes per cycle
bet_passes = 3
# BET_PASS_WAIT_SECONDS — sleep between passes
bet_pass_wait_seconds = 10


[eth_1h]
# SELL_TARGET — take-profit price (ignored when redeem_only_mode = true)
sell_target = 0.99
# STOP_LOSS — exit immediately if position bid drops below this
stop_loss = 0.60
# BET_SHARES — target shares per trade
bet_shares = 20
# K_DEFAULT — Brownian Bridge k, auto-calibrated once >= 10 outcomes exist
k_default = 0.09
# MIN_MINUTES / MAX_MINUTES — entry window in minutes remaining before expiry
min_minutes = 0
max_minutes = 7
# REDEEM_ONLY_MODE — hold to resolution/redeem; no TP sell placement
redeem_only_mode = true


[gamma]
# EVENT_HORIZON_HOURS — how far out to fetch events from Gamma
event_horizon_hours = 30
events_page_size = 10
events_max_pages = 20
# Connection tuning
connect_timeout = 10
read_timeout = 30
max_attempts = 4
backoff_base = 1.5


[restream]
# Twitch -> YouTube restream daemon (restream/ package).
# Secrets (TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET) stay in restream/.env.
# Every value below is also overridable via an environment variable of the
# same UPPERCASE name.

# TWITCH_CHANNEL — which Twitch channel to watch.
twitch_channel = "hasanabi"

# YOUTUBE_BROADCAST_PRIVACY — public | unlisted | private
youtube_broadcast_privacy = "public"
# YOUTUBE_LATENCY — viewer-side buffering. Bigger = smoother.
#   normal   ~10-15s buffer, most forgiving (recommended)
#   low      ~5s buffer
#   ultraLow ~2s buffer, most "live" but most prone to stalls
youtube_latency = "normal"
# Paths to the OAuth client secret + cached user token (files themselves
# are gitignored — these are just pointers).
youtube_oauth_client_file = "restream/youtube_oauth_client.json"
youtube_token_file = "restream/youtube_token.json"

# RESTREAM_QUALITY — streamlink quality token: best, 1080p60, 720p, ...
quality = "best"
# RESTREAM_RETRY_SECONDS — Helix poll interval when Twitch is offline
retry_seconds = 30
# RESTREAM_RECONNECT_SECONDS — delay before reconnecting to the same
# broadcast after a pipe drop (ffmpeg / streamlink exit)
reconnect_seconds = 5
# RESTREAM_HLS_LIVE_EDGE — # segments behind Twitch's live edge. Each segment
# is ~2s, so 15 ≈ 30s of buffer against HLS hiccups.
hls_live_edge = 15
# RESTREAM_BUFFER_MB — streamlink in-memory ring buffer
buffer_mb = 64
# RESTREAM_REENCODE_AUDIO / RESTREAM_REENCODE_VIDEO
# Audio re-encode kills ad-break beeps (~5% CPU). Video re-encode smooths
# PTS across ad boundaries (~1 CPU core) and is off by default — the
# audio re-encode alone resolves 95% of the observable weirdness. Flip
# reencode_video back to true, or pass --full-reencode, if you see
# visible glitches at Twitch ad breaks. --passthrough disables both.
reencode_audio = true
reencode_video = false
# RESTREAM_VIDEO_BITRATE_KBPS — only used when reencode_video = true
video_bitrate_kbps = 6000

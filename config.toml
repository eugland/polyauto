# polyauto tunable configuration
#
# Precedence at runtime: environment variable > this file > code default.
# Secrets (POLYMARKET_PRIVATE_KEY, RELAYER_API_KEY, etc.) stay in .env.
# Edit these values freely — every setting here has a matching default in
# Python code, so removing a key just restores the default.

[polymarket]
# POLYMARKET_HOST
host = "https://clob.polymarket.com"
# POLYMARKET_SIG_TYPE — 0=EOA, 1=Gnosis Safe/Magic.link, 2=Polymarket proxy
signature_type = 2
# POLYMARKET_RELAYER_URL
relayer_url = "https://relayer-v2.polymarket.com"


[weather]
# ── Price gates ───────────────────────────────────────────────────────────
# MIN_NO_PRICE — don't buy if the live bid is below this
min_no_price = 0.97
# MAX_NO_PRICE — don't buy if the live ask/bid is above this
max_no_price = 0.997
# BET_THRESHOLD — auto-bet above this price
bet_threshold = 0.95
# BET_SIZE_SHARES — USDC notional used to compute bet shares (run-time scales)
bet_size_shares = 64.0
# TAKE_PROFIT_PRICE — price at which to place the resting sell on held positions
take_profit_price = 0.999

# ── Market-maker pricing ──────────────────────────────────────────────────
# MM_TICK_SIZE
mm_tick_size = 0.001
# MM_JOIN_BID_TICKS — how many ticks above best bid to join
mm_join_bid_ticks = 1
# MM_REPRICE_CENTS — reprice an existing order only when delta exceeds this
mm_reprice_cents = 0.10

# ── City filter ───────────────────────────────────────────────────────────
# CITY_BLACKLIST — cities excluded from all candidates and top-ups.
# Override at runtime with comma-separated env var, e.g.
# CITY_BLACKLIST=Seoul,Lagos python -m temp_buyer.weather --bet
city_blacklist = [
    "Seoul",
    "Taipei",
    "Lagos",
    "Denver",
    "Jakarta",
    "Chongqing",
    "Hong Kong",
    "Shenzhen",
    "Busan",
]

# ── Temperature safety margins ────────────────────────────────────────────
# METAR_GUARD_MARGIN_C / METAR_GUARD_MARGIN_F — advisory only, logs a warning
# when observed METAR temp is within this many degrees of the threshold.
metar_guard_margin_c = 2.0
metar_guard_margin_f = 4.0

# ── Weather-model edge logging ─────────────────────────────────────────────
# MODEL_EDGE_MAX_BPS — candidates where market NO ask exceeds the model's
# fair NO prob by more than this many bps are logged as "would-veto" but
# are not blocked. Useful for calibrating before enforcing the gate.
model_edge_max_bps = 200.0

# ── Scheduling ────────────────────────────────────────────────────────────
# POST_RESOLUTION_GRACE_HOURS — keep events in scope this long after resolve
post_resolution_grace_hours = 7.0
# SCAN_TARGET_CITIES — scan batches of 15 events (earliest-resolution first)
# until we've found this many distinct viable cities, then stop. Matches the
# downstream top-10 cap; raise to scan more, lower to scan less per cycle.
scan_target_cities = 10
# USER_TZ — timezone used for dry-run display
user_tz = "America/Los_Angeles"

# ── Order retries ─────────────────────────────────────────────────────────
# STALE_ORDER_MINUTES — cancel unfilled BUY orders older than this
stale_order_minutes = 1.0
# BET_PASSES — total passes per cycle
bet_passes = 3
# BET_PASS_WAIT_SECONDS — sleep between passes
bet_pass_wait_seconds = 10


[temp_buyer]
# temp_buyer.temp_buyer — buys NO at the top of the temp_buyer.view list
# (lowest temp bucket sitting strictly below the YES-favorite). The
# city blacklist is shared with [weather] so this section doesn't
# duplicate it.

# TEMPBUY_MIN_NO_ASK / TEMPBUY_MAX_NO_ASK — accept buckets with NO ask
# in [min, max] (inclusive). min=0.99 keeps us in the highest-confidence
# band only. max=0.998 skips the saturated 99.9¢ top-of-stack bucket in
# favor of the next bucket down, which has more upside per share.
min_no_ask = 0.99
max_no_ask = 0.999

# TEMPBUY_MIN_DELTA_C / TEMPBUY_MIN_DELTA_F — gap to YES-favorite
# bucket required, applied per-event using the question's unit.
min_delta_c = 2.0
min_delta_f = 4.0

# TEMPBUY_BET_SHARES — target share size per bet. If free USDC balance
# is short, the bot does a partial fill for whatever the balance allows
# (down to TEMPBUY_MIN_TOPUP_SHARES).
bet_shares = 100.0

# TEMPBUY_MIN_BUCKET_DISTANCE — minimum ladder steps below the YES-
# favorite a candidate must sit before we'll buy. The picker already
# selects the farthest-below qualifying bucket; this is a safety floor
# that rejects events where nothing is at least this far down.
min_bucket_distance = 2

# TEMPBUY_MIN_TOPUP_SHARES — absolute minimum order size (shares). Used
# both for top-up gap and for partial-fill new entries when balance is
# short. 1.05 is just above Polymarket's $1 min order at 99¢ ask, so
# any spendable balance ≥ ~$1.05 will fire.
min_topup_shares = 1.05

# TEMPBUY_MIN_HOURS / TEMPBUY_MAX_HOURS — only consider events whose
# local-3pm resolution falls in [now+min_hours, now+max_hours].
# capping at 18h drops events where the YES favorite hasn't settled.
min_hours = 0.0
max_hours = 18

# TEMPBUY_STALE_MINUTES — cancel our own unfilled BUY orders older than
# this many minutes at the start of every live run. Frees the USDC that
# Polymarket has reserved for those resting orders so it can be
# redeployed. Set 0 to disable; lower = faster reclaim, but cancels
# orders that might still fill at troughs.
stale_minutes = 3.0

# TEMPBUY_MIN_BALANCE_USDC — USDC reserve. The bot will never spend down
# past this balance: bet sizes are computed against (balance - reserve),
# the new-buy pass is skipped if balance ≤ reserve, and partial-fills use
# only the spendable surplus. 0 = no reserve, spend whatever's there.
min_balance_usdc = 5.0

# TEMPBUY_MIN_ASK_SIZE — minimum shares available at the live NO ask (CLOB book
# depth). A thin ask queue (e.g. 5 sh) means barely anyone is selling NO there,
# which is a low-conviction signal. Default 20 sh; set 0 to disable the gate.
min_ask_size = 20.0

# Two complementary book-shape floors:
# TEMPBUY_MIN_BID_PCT_ABOVE — % of real bid size at ≥95c. Single-point cut.
# 4% lets early-cycle markets through; ranking does the rest.
# TEMPBUY_MIN_BID_P75 — top-75% conviction price among bids ≥10c (excludes
# MM penny bait). Captures the *shape* of the bid book — does the bottom
# quartile of real bidders still pay >= this much? A high p75 means support
# extends deep into the book; a low p75 means the book collapses fast.
# Calibrated 2026-05-20 to 0.70 (the natural break between weak-shape clusters
# at 57–60c and acceptable-shape clusters at 72–97c across 14 candidate markets).
# Lowered to 0.69 to allow borderline markets (e.g. Toronto at 69c) through.
min_bid_pct_above = 4.0
min_bid_p75 = 0.70

# Candidate scoring: score = bucket_distance * score_bucket_weight
#                          - hours_to_resolution * score_hours_weight
#                          + log(1+volume) * score_volume_weight
#                          + bid_pct_above   * score_conviction_weight
#                          + bid_p75         * score_p75_weight
# score_conviction_weight rewards exit liquidity near full value (95c+);
# score_p75_weight rewards book-shape integrity (deep support, not just a thin spike).
# Raise score_bucket_weight to favor deeper-below-favorite buckets;
# raise score_hours_weight to penalize lead time more aggressively.
score_bucket_weight = 5.0
score_hours_weight = 2.0
score_volume_weight = 1.0
score_conviction_weight = 0.1
score_p75_weight = 8.0

# TEMPBUY_REDEEM_RESOLVED — after each live cycle, scan funder positions
# and redeem any whose condition has resolved on-chain. Required since
# we no longer place take-profit sells; otherwise winning shares stay
# parked until something else (eth daemon) sweeps them.
redeem_resolved = true

# TEMPBUY_REDEEM_MODE — relayer (default, gasless via Polymarket relayer)
# or onchain (direct call from POLYMARKET_PRIVATE_KEY; needs POLYGON_RPC_URL).
redeem_mode = "relayer"



[gamma]
# EVENT_HORIZON_HOURS — how far out to fetch events from Gamma
event_horizon_hours = 30
events_page_size = 10
events_max_pages = 20
# Connection tuning
connect_timeout = 10
read_timeout = 30
max_attempts = 4
backoff_base = 1.5


[dashboard]
# Dashboard web app (python -m dashboard). All values overridable via the
# matching UPPERCASE env var.
# DASHBOARD_PORT
port = 8000
# DASHBOARD_POLL_INTERVAL_SECONDS — balance-snapshot cadence
poll_interval_seconds = 300
# DASHBOARD_MY_ADDRESS — wallet to show on the Positions tab. Blank = use
# POLYMARKET_FUNDER from .env.
my_address = ""
# DASHBOARD_PROS — other traders to watch, "label:0xaddress" each.
# Addresses recovered from the old pro_study/ dumps (git 68e58be).
# (auniwarper 0x0ec4…5ed3 is your own funder — shown on the Positions tab.)
pros = [
    "ColdMath:0x594edb9112f526fa6a80b8f858a6379c8a2c1c11",
    "Hans323:0x0f37cb80dee49d55b5f6d9e595d52591d6371410",
    "aapang:0x104171232971a6db8cf938f76fdbebbb81c5f452",
    "aenews2:0x44c1dfe43260c94ed4f1d00de2e1f80fb113ebc1",
    "gopfan:0x6af75d4e4aaf700450efbac3708cce1665810ff1",
    "gopfan2:0xf2f6af4f27ec2dcf4072095ab804016e14cd5817",
    "haerder:0x8dec027d883949a6bfe79842d0ae6b80347e46e0",
    "sin3000:0x8d71ff86701227bb479b2039edd92b08f73115d8",
]
